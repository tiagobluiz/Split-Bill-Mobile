appId: com.miagology.splitbill
name: Group member archive and restore
---
- launchApp
- tapOn:
    text: Open Groups
- tapOn: Add group
- tapOn:
    text: e.g. Roomies
- inputText: Archive Fixture Final
- hideKeyboard
- tapOn: Continue to members
- tapOn: Import from contacts
- tapOn:
    text: Allow
    optional: true
- assertVisible: ".*No contacts available.*"
- tapOn: Back
- tapOn: Search or add people
- inputText: Zoe E2E Final
- hideKeyboard
- tapOn: 'Add “Zoe E2E Final”'
- tapOn: Save group
- assertVisible: Archive Fixture Final
- tapOn:
    text: ".*People \\(.*\\)"
- tapOn:
    text: ".*Active \\(.*\\)"
- assertVisible: Zoe E2E Final
- tapOn: Open actions for Zoe E2E Final
- tapOn: Delete person
- assertVisible: Delete person?
- tapOn: Delete person
- tapOn:
    text: ".*Archived \\(.*\\)"
- assertVisible: Zoe E2E Final
- tapOn:
    text: ".*Groups \\(.*\\)"
- tapOn: Add group
- tapOn:
    text: e.g. Roomies
- inputText: Restore Fixture Final
- hideKeyboard
- tapOn: Continue to members
- tapOn: Search or add people
- inputText: Zoe E2E Final
- hideKeyboard
- tapOn: 'Add and restore “Zoe E2E Final”'
- assertVisible: Will restore archived person
- tapOn: Save group
- assertVisible: Restore Fixture Final
- tapOn:
    text: ".*People \\(.*\\)"
- tapOn:
    text: ".*Active \\(.*\\)"
- assertVisible: Zoe E2E Final
