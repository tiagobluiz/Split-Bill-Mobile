appId: com.miagology.splitbill
name: Import a contact into the people directory
---
- launchApp
- tapOn: Open Groups
- tapOn:
    text: ".*People \\(.*\\)"
- tapOn: Add person
- tapOn: Import from contacts
- assertVisible: Choose a contact
- tapOn: Release Contact
- tapOn: Done
- assertVisible: Release Contact
- tapOn: Save
- assertVisible: Release Contact
