appId: com.miagology.splitbill
name: Add a group member to a split
---
- launchApp
- tapOn: Open Home
- tapOn: Start New Split
- tapOn: Split name
- inputText: Group QA Split
- hideKeyboard
- tapOn: "Next: Add Participants"
- assertVisible: Frequent
- assertVisible: Groups
- tapOn: Groups
- tapOn: Add Zoe E2E Final from Archive Fixture Final
- assertVisible: Zoe E2E Final
- assertVisible: Added
- tapOn: "Next: Select Payer"
- assertVisible: Almost there
- tapOn: Dismiss split notice
- tapOn: Frequent
- tapOn: Add frequent friend You
- tapOn: "Next: Select Payer"
- assertVisible: Zoe E2E Final
